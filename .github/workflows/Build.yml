name: Build Xbox UWP

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - uses: nuget/setup-nuget@v2

      - name: Gerar icones
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          New-Item -ItemType Directory -Force Assets | Out-Null
          $icons = @(@('StoreLogo',50), @('Square44x44Logo',44), @('Square150x150Logo',150))
          foreach ($i in $icons) {
            $bmp = New-Object System.Drawing.Bitmap $i[1], $i[1]
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.Clear([System.Drawing.Color]::FromArgb(16,124,16))
            $g.Dispose()
            $bmp.Save("Assets\$($i[0]).png", [System.Drawing.Imaging.ImageFormat]::Png)
            $bmp.Dispose()
          }

      - name: Gerar certificado de teste
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=RpcsTest" -KeyUsage DigitalSignature -FriendlyName "RpcsTest" -CertStoreLocation "Cert:\CurrentUser\My" -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $pw = ConvertTo-SecureString -String "senha123" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath RpcsTest.pfx -Password $pw | Out-Null
          Export-Certificate -Cert $cert -FilePath RpcsTest.cer | Out-Null

      - name: Restaurar pacotes
        run: nuget restore packages.config -PackagesDirectory packages

      - name: Compilar
        shell: pwsh
        run: |
          msbuild RpcsTest.vcxproj /p:Configuration=Release /p:Platform=x64 /p:AppxBundle=Never /p:UapAppxPackageBuildMode=SideloadOnly /p:AppxPackageSigningEnabled=true /p:PackageCertificateKeyFile="$PWD\RpcsTest.pfx" /p:PackageCertificatePassword=senha123 /p:AppxPackageDir="$PWD\out\"

      - uses: actions/upload-artifact@v4
        with:
          name: RpcsTest-Xbox
          path: |
            out/**
            RpcsTest.cer
N=RpcsTest" -KeyUsage DigitalSignature -FriendlyName "RpcsTest" -CertStoreLocation "Cert:\CurrentUser\My" -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $pw = ConvertTo-SecureString -String "senha123" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath RpcsTest.pfx -Password $pw | Out-Null
          Export-Certificate -Cert $cert -FilePath RpcsTest.cer | Out-Null

      - name: Restaurar pacotes
        run: nuget restore packages.config -PackagesDirectory packages

      - name: Compilar
        shell: pwsh
        run: |
          msbuild RpcsTest.vcxproj /p:Configuration=Release /p:Platform=x64 /p:AppxBundle=Never /p:UapAppxPackageBuildMode=SideloadOnly /p:AppxPackageSigningEnabled=true /p:PackageCertificateKeyFile="$PWD\RpcsTest.pfx" /p:PackageCertificatePassword=senha123 /p:AppxPackageDir="$PWD\out\"

      - uses: actions/upload-artifact@v4
        with:
          name: RpcsTest-Xbox
          path: |
            out/**
            Rpc
